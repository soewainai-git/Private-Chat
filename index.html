<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Pesan</title>
    <meta name="description" content="Aplikasi obrolan pribadi khusus mobile dengan tema dark mode, perlindungan anti-screenshot, foto sekali lihat, dan status online real-time." />
    <meta property="og:title" content="Pesan" />
    <meta property="og:description" content="Aplikasi obrolan pribadi khusus mobile." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pesan" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Proteksi Anti-Print / Anti-Screenshot Print Media */
      @media print {
        html, body {
          display: none !important;
          visibility: hidden !important;
        }
      }
      /* Prevent select, rubber-banding, and unwanted viewport bouncing */
      html, body {
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        background-color: #0b0f17;
        color: #e2e8f0;
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-[#0b0f17] text-slate-100 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
