<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop shadow for the white speech bubble -->
    <filter id="shadowWhite" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <!-- Drop shadow for the whole icon -->
    <filter id="shadowMain" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#shadowMain)">
    <!-- Primary Blue Speech Bubble -->
    <!-- Large rounded oval with tail at bottom-left -->
    <path d="M 260 40 
             C 385 40 475 125 475 235 
             C 475 345 385 410 260 410 
             C 230 410 200 405 175 395 
             C 145 425 110 440 108 440 
             C 105 440 104 436 107 430 
             C 112 418 128 375 120 350 
             C 65 315 45 270 45 235 
             C 45 125 135 40 260 40 Z" 
          fill="#31A3FF" />
  </g>

  <!-- Foreground White Speech Bubble with shadow -->
  <g filter="url(#shadowWhite)">
    <!-- White circular bubble with small tail at bottom-right -->
    <path d="M 335 210 
             C 415 210 475 268 475 340 
             C 475 412 415 465 335 465 
             C 305 465 285 460 270 452 
             C 250 468 230 475 228 475 
             C 225 475 225 471 228 466 
             C 232 458 240 435 235 422 
             C 208 402 195 372 195 340 
             C 195 268 255 210 335 210 Z" 
          fill="#F5F8FC" />
  </g>

  <!-- Three dots inside the white speech bubble -->
  <circle cx="280" cy="338" r="20" fill="#1366BE" />
  <circle cx="335" cy="338" r="20" fill="#1366BE" />
  <circle cx="390" cy="338" r="20" fill="#1366BE" />
</svg>
